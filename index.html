<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c4dff">
<meta name="description" content="Nyan Shop - Backgrounds">
<link rel="manifest" href="manifest.json">
<title>Nyan Shop</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef6ff;
  color:#222;
  transition:.2s;
}
body.dark{background:#15151d;color:#eee}
header{
  padding:18px;
  text-align:center;
  background:linear-gradient(135deg,#7c4dff,#42a5f5);
  color:white;
}
h1{margin:5px;font-size:32px}
header p{margin:5px}
nav{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  padding:12px;
}
button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
  background:#7c4dff;
  color:white;
}
button:hover{opacity:.85}
.search{
  display:flex;
  max-width:700px;
  margin:10px auto 20px;
  padding:0 10px;
}
.search input{
  flex:1;
  padding:13px;
  border:2px solid #ddd;
  border-radius:10px 0 0 10px;
  font-size:16px;
}
.search button{border-radius:0 10px 10px 0}
#products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  padding:16px;
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  border-radius:15px;
  padding:12px;
  box-shadow:0 4px 15px #0002;
  transition:.2s;
}
.dark .card{background:#24242f}
.card:hover{transform:translateY(-4px)}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:11px;
  background:#ddd;
}
.card h3{margin:10px 0 5px}
.price{
  font-size:19px;
  font-weight:bold;
  color:#7c4dff;
}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}
.actions button{flex:1}
.fav{background:#e91e63}
.download{background:#2196f3}
.details{background:#607d8b}
#cart,#favorites,#owner{
  max-width:900px;
  margin:20px auto;
  padding:18px;
  background:white;
  border-radius:15px;
  box-shadow:0 4px 15px #0002;
}
.dark #cart,.dark #favorites,.dark #owner{background:#24242f}
.hidden{display:none}
footer{
  text-align:center;
  padding:25px;
  margin-top:30px;
}
input,textarea{
  padding:10px;
  border-radius:8px;
  border:1px solid #bbb;
}
.owner-form{
  display:grid;
  gap:8px;
}
.owner-form input,.owner-form textarea{width:100%}
</style>
</head>

<body>

<header>
  <h1>🐱 Nyan Shop</h1>
  <p>Beautiful backgrounds for your device</p>
</header>

<nav>
  <button onclick="showHome()">🏠 Home</button>
  <button onclick="showFavorites()">❤️ Favorites</button>
  <button onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
  <button onclick="toggleDark()">🌙 Dark Mode</button>
  <button onclick="ownerLogin()">🔐 Owner</button>
</nav>

<div class="search">
  <input id="searchInput" placeholder="Search backgrounds...">
  <button onclick="searchProducts()">Search</button>
</div>

<main id="products"></main>

<section id="favorites" class="hidden">
  <h2>❤️ Favorites</h2>
  <div id="favoriteList"></div>
</section>

<section id="cart" class="hidden">
  <h2>🛒 Your Cart</h2>
  <div id="cartList"></div>
  <h3 id="cartTotal"></h3>
</section>

<section id="owner" class="hidden">
  <h2>🔐 Owner Page</h2>

  <div id="ownerLoginBox">
    <input id="ownerCode" type="password" placeholder="Owner code">
    <button onclick="checkOwner()">Enter</button>
  </div>

  <div id="ownerPanel" class="hidden">
    <h3>Add a Background</h3>

    <div class="owner-form">
      <input id="newName" placeholder="Background name">
      <input id="newPrice" type="number" step="0.01" placeholder="Price">
      <input id="newImage" placeholder="Image path e.g. images/cat.jpg">
      <textarea id="newDescription" placeholder="Description"></textarea>
      <button onclick="addProduct()">➕ Add Background</button>
    </div>

    <h3>Delete Backgrounds</h3>
    <div id="deleteList"></div>
  </div>
</section>

<footer>
  © 2026 Nyan Shop 🐱
</footer>

<script>
const OWNER_CODE="5124";

let products=JSON.parse(localStorage.getItem("nyanProducts")) || [
  {
    id:1,
    name:"Cute Cat",
    price:0.20,
    image:"images/cat.jpg",
    description:"A cute cat background."
  },
  {
    id:2,
    name:"Anime Style",
    price:0.25,
    image:"images/anime.jpg",
    description:"Anime-style background."
  },
  {
    id:3,
    name:"Nature",
    price:0.20,
    image:"images/nature.jpg",
    description:"Beautiful nature background."
  }
];

let favorites=JSON.parse(localStorage.getItem("nyanFavorites")) || [];
let cart=JSON.parse(localStorage.getItem("nyanCart")) || [];

function save(){
  localStorage.setItem("nyanProducts",JSON.stringify(products));
  localStorage.setItem("nyanFavorites",JSON.stringify(favorites));
  localStorage.setItem("nyanCart",JSON.stringify(cart));
}

function render(list=products){
  const box=document.getElementById("products");
  box.innerHTML="";

  if(list.length===0){
    box.innerHTML="<h2>No backgrounds found 😿</h2>";
    return;
  }

  list.forEach(p=>{
    const isFav=favorites.includes(p.id);

    box.innerHTML+=`
      <article class="card">
        <img src="${p.image}" alt="${escapeHTML(p.name)}"
             onerror="this.onerror=null;this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23ddd%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 font-size=%2230%22>Image not found</text></svg>'">

        <h3>${escapeHTML(p.name)}</h3>
        <div class="price">$${Number(p.price).toFixed(2)}</div>

        <div class="actions">
          <button onclick="downloadImage(${p.id})" class="download">⬇ Download</button>
          <button onclick="toggleFavorite(${p.id})" class="fav">
            ${isFav?"💔 Remove":"❤️ Favorite"}
          </button>
          <button onclick="addCart(${p.id})">🛒 Cart</button>
          <button onclick="details(${p.id})" class="details">ℹ Details</button>
        </div>
      </article>
    `;
  });
}

function escapeHTML(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function downloadImage(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;

  const a=document.createElement("a");
  a.href=p.image;
  a.download=(p.name.replace(/[^a-z0-9]/gi,"_")||"nyan-background")+".jpg";
  a.target="_blank";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
  }else{
    favorites.push(id);
  }

  save();
  render();
}

function showFavorites(){
  hideAll();
  document.getElementById("favorites").classList.remove("hidden");

  const list=document.getElementById("favoriteList");
  const favProducts=products.filter(p=>favorites.includes(p.id));

  if(!favProducts.length){
    list.innerHTML="<p>No favorites yet ❤️</p>";
    return;
  }

  list.innerHTML=favProducts.map(p=>
    `<p>❤️ <b>${escapeHTML(p.name)}</b> — $${Number(p.price).toFixed(2)}</p>`
  ).join("");
}

function addCart(id){
  cart.push(id);
  save();
  updateCart();
  alert("Added to cart 🛒");
}

function updateCart(){
  document.getElementById("cartCount").textContent=cart.length;

  const list=document.getElementById("cartList");

  if(!cart.length){
    list.innerHTML="<p>Your cart is empty.</p>";
    document.getElementById("cartTotal").textContent="";
    return;
  }

  let total=0;

  list.innerHTML=cart.map((id,index)=>{
    const p=products.find(x=>x.id===id);
    if(!p)return "";

    total+=Number(p.price);

    return `
      <p>
        ${escapeHTML(p.name)} — $${Number(p.price).toFixed(2)}
        <button onclick="removeCart(${index})">Remove</button>
      </p>
    `;
  }).join("");

  document.getElementById("cartTotal").textContent=
    "Total: $"+total.toFixed(2);
}

function removeCart(index){
  cart.splice(index,1);
  save();
  updateCart();
}

function showCart(){
  hideAll();
  document.getElementById("cart").classList.remove("hidden");
  updateCart();
}

function details(id){
  const p=products.find(x=>x.id===id);
  alert(p.name+"\n\n"+p.description+"\n\nPrice: $"+Number(p.price).toFixed(2));
}

function searchProducts(){
  const q=document.getElementById("searchInput").value.toLowerCase().trim();

  const result=products.filter(p=>
    p.name.toLowerCase().includes(q) ||
    p.description.toLowerCase().includes(q)
  );

  hideAll();
  render(result);
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "nyanDark",
    document.body.classList.contains("dark")
  );
}

function hideAll(){
  document.getElementById("favorites").classList.add("hidden");
  document.getElementById("cart").classList.add("hidden");
  document.getElementById("owner").classList.add("hidden");
}

function showHome(){
  hideAll();
  render();
}

function ownerLogin(){
  hideAll();
  document.getElementById("owner").classList.remove("hidden");
  document.getElementById("ownerPanel").classList.add("hidden");
  document.getElementById("ownerLoginBox").classList.remove("hidden");
}

function checkOwner(){
  const code=document.getElementById("ownerCode").value;

  if(code===OWNER_CODE){
    document.getElementById("ownerLoginBox").classList.add("hidden");
    document.getElementById("ownerPanel").classList.remove("hidden");
    renderDeleteList();
  }else{
    alert("Wrong owner code.");
  }
}

function addProduct(){
  const name=document.getElementById("newName").value.trim();
  const price=parseFloat(document.getElementById("newPrice").value);
  const image=document.getElementById("newImage").value.trim();
  const description=document.getElementById("newDescription").value.trim();

  if(!name || !image || isNaN(price)){
    alert("Please fill in the name, price and image path.");
    return;
  }

  products.push({
    id:Date.now(),
    name:name,
    price:price,
    image:image,
    description:description || "Nyan Shop background."
  });

  save();

  document.getElementById("newName").value="";
  document.getElementById("newPrice").value="";
  document.getElementById("newImage").value="";
  document.getElementById("newDescription").value="";

  renderDeleteList();
  render();

  alert("Background added!");
}

function renderDeleteList(){
  const box=document.getElementById("deleteList");

  box.innerHTML=products.map(p=>`
    <p>
      ${escapeHTML(p.name)}
      <button onclick="deleteProduct(${p.id})">🗑 Delete</button>
    </p>
  `).join("");
}

function deleteProduct(id){
  if(!confirm("Delete this background?"))return;

  products=products.filter(p=>p.id!==id);
  favorites=favorites.filter(x=>x!==id);
  cart=cart.filter(x=>x!==id);

  save();
  render();
  renderDeleteList();
  updateCart();
}

if(localStorage.getItem("nyanDark")==="true"){
  document.body.classList.add("dark");
}

render();
updateCart();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("service-worker.js")
      .catch(()=>{});
  });
}
</script>

</body>
</html>
