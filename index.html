<!DOCTYPE html> <html lang="en"> <head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#87CEEB">
 <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Nyan Background Shop</title> <meta name="theme-color" content="#6366f1"> <style> *{ box-sizing:border-box; } body{ margin:0; font-family:Arial,sans-serif; background:#eef7ff; color:#222; transition:.2s; } body.dark{ background:#151515; color:white; } header{ padding:30px 15px; text-align:center; background:linear-gradient(135deg,#38bdf8,#8b5cf6); color:white; } header h1{ margin:0; font-size:36px; } header p{ margin:8px 0 0; } nav{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:12px; background:white; box-shadow:0 2px 8px #0002; } body.dark nav{ background:#222; } button{ border:0; border-radius:9px; padding:10px 14px; cursor:pointer; background:#6366f1; color:white; font-weight:bold; } button:hover{ opacity:.85; } .install{ background:#16a34a; } .search{ max-width:700px; margin:20px auto; padding:0 12px; display:flex; gap:8px; } .search input{ flex:1; padding:13px; border:2px solid #ddd; border-radius:10px; font-size:16px; } main{ max-width:1100px; margin:auto; padding:10px; } .title{ text-align:center; margin:25px 0 15px; } .filter{ text-align:center; margin:15px; } .filter button{ margin:4px; } .grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap:15px; } .card{ background:white; border-radius:14px; overflow:hidden; box-shadow:0 3px 12px #0002; transition:.2s; } body.dark .card{ background:#242424; } .card:hover{ transform:translateY(-4px); } .card img{ width:100%; aspect-ratio:9/16; object-fit:cover; display:block; background:#ddd; } .info{ padding:12px; } .info h3{ margin:0 0 7px; } .price{ font-size:18px; font-weight:bold; margin-bottom:10px; } .free{ color:#16a34a; } .paid{ color:#d97706; } .badge{ display:inline-block; padding:4px 8px; border-radius:20px; font-size:12px; font-weight:bold; margin-bottom:8px; } .freeBadge{ background:#dcfce7; color:#166534; } .paidBadge{ background:#fef3c7; color:#92400e; } .actions{ display:flex; gap:6px; flex-wrap:wrap; } .actions button{ flex:1; min-width:65px; } .favorite{ background:#ec4899; } .download{ background:#16a34a; } .details{ background:#f59e0b; } .empty{ text-align:center; padding:40px 10px; opacity:.7; } .panel{ max-width:600px; margin:30px auto; padding:20px; background:white; border-radius:15px; box-shadow:0 3px 12px #0002; } body.dark .panel{ background:#242424; } .login, .owner{ display:none; } .login.show, .owner.show{ display:block; } .panel input, .panel select{ width:100%; padding:11px; margin:7px 0 12px; border:1px solid #aaa; border-radius:8px; font-size:15px; } .owner-item{ padding:10px 0; border-bottom:1px solid #aaa; } .delete{ background:#dc2626; margin-left:8px; } footer{ text-align:center; padding:30px 10px; margin-top:30px; background:#111827; color:white; } @media(max-width:600px){ header h1{ font-size:29px; } .grid{ grid-template-columns:repeat(2,1fr); gap:10px; } .card img{ aspect-ratio:9/14; } .search{ flex-direction:column; } .search button{ width:100%; } } </style> </head> <body> <header> <h1>🎨 Nyan Background Shop</h1> <p>Beautiful backgrounds every day ✨</p> </header> <nav> <button onclick="showHome()"> 🏠 Home </button> <button onclick="showFavorites()"> ❤️ Favorites </button> <button onclick="showFree()"> 🆓 Free </button> <button onclick="showPaid()"> 💎 Paid </button> <button onclick="toggleDark()"> 🌙 Dark </button> <button onclick="openLogin()"> 🔐 Owner </button> <button class="install" onclick="installApp()"> 📱 App </button> </nav> <div class="search"> <input id="searchBox" placeholder="Search backgrounds..."> <button onclick="searchBackgrounds()"> 🔎 Search </button> </div> <main> <h2 class="title"> 🔥 Backgrounds </h2> <div id="shop" class="grid"> </div> <div id="favoritesArea" style="display:none"> <h2 class="title"> ❤️ My Favorites </h2> <div id="favorites" class="grid"> </div> </div> <!-- OWNER LOGIN --> <section id="loginPanel" class="panel login"> <h2>🔐 Owner Login</h2> <p>Enter owner code:</p> <input id="ownerCode" type="password" placeholder="Owner code"> <button onclick="loginOwner()"> Login </button> <button onclick="closeLogin()"> Cancel </button> <p id="loginMessage"></p> </section> <!-- OWNER PANEL --> <section id="ownerPanel" class="panel owner"> <h2>👑 Owner Panel</h2> <label> Background name </label> <input id="bgName" placeholder="Example: Galaxy Night"> <label> Type </label> <select id="bgType"> <option value="free"> 🆓 FREE </option> <option value="paid"> 💎 PAID </option> </select> <label> Price in USD </label> <input id="bgPrice" type="number" min="0" max="0.30" step="0.01" placeholder="0 for FREE"> <label> Choose picture </label> <input id="bgImage" type="file" accept="image/*"> <br><br> <button onclick="addBackground()"> ➕ Add Background </button> <p> 🆓 Free = $0.00<br> 💎 Paid = $0.01 - $0.30 </p> <hr> <h3> 🗑️ Manage Backgrounds </h3> <div id="ownerList"></div> <br> <button onclick="logoutOwner()"> Logout </button> </section> </main> <footer> © 2026 Nyan Background Shop <br> Made with ❤️ by Nyan </footer> <script> /* ========================= STARTER BACKGROUNDS ========================= */ let backgrounds= JSON.parse( localStorage.getItem( "nyanBackgrounds" )||"null" ); if(!backgrounds){ backgrounds=[ { id:1, name:"Blue Sky", type:"free", price:0, image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" }, { id:2, name:"Purple Dream", type:"free", price:0, image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500" }, { id:3, name:"Ocean", type:"free", price:0, image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" }, { id:4, name:"Sakura", type:"free", price:0, image:"https://images.unsplash.com/photo-1522383225653-ed111181a951?w=500" }, { id:5, name:"Night Sky", type:"free", price:0, image:"https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500" }, { id:6, name:"Forest", type:"free", price:0, image:"https://images.unsplash.com/photo-1448375240586-882707db888b?w=500" }, { id:7, name:"Sunset", type:"free", price:0, image:"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500" }, { id:8, name:"Mountain", type:"free", price:0, image:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500" }, { id:9, name:"Neon City", type:"paid", price:0.20, image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500" }, { id:10, name:"Galaxy", type:"paid", price:0.30, image:"https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?w=500" } ]; saveData(); } /* ========================= SAVE ========================= */ function saveData(){ localStorage.setItem( "nyanBackgrounds", JSON.stringify( backgrounds ) ); } /* ========================= DISPLAY ========================= */ function displayBackgrounds( list=backgrounds ){ const shop= document.getElementById( "shop" ); shop.innerHTML=""; if(list.length===0){ shop.innerHTML= '<div class="empty">'+ 'No backgrounds found 🎨'+ '</div>'; return; } list.forEach(bg=>{ const card= document.createElement( "div" ); card.className="card"; let badge; let price; if(bg.type==="free"){ badge= '<span class="badge freeBadge">'+ '🆓 FREE'+ '</span>'; price= '<div class="price free">'+ 'FREE'+ '</div>'; }else{ badge= '<span class="badge paidBadge">'+ '💎 PAID'+ '</span>'; price= '<div class="price paid">'+ '$'+Number(bg.price).toFixed(2)+ '</div>'; } card.innerHTML=` <img src="${bg.image}" alt="${escapeHTML(bg.name)}"> <div class="info"> ${badge} <h3> ${escapeHTML(bg.name)} </h3> ${price} <div class="actions"> <button class="favorite" onclick="favorite(${bg.id})"> ❤️ </button> <button class="details" onclick="showDetails(${bg.id})"> ℹ️ </button> <button class="download" onclick="downloadBackground(${bg.id})"> ⬇️ </button> </div> </div> `; shop.appendChild(card); }); } /* ========================= SEARCH ========================= */ function searchBackgrounds(){ const q= document.getElementById( "searchBox" ).value .toLowerCase() .trim(); displayBackgrounds( backgrounds.filter( bg=> bg.name .toLowerCase() .includes(q) ) ); } /* ========================= FILTER ========================= */ function showFree(){ displayBackgrounds( backgrounds.filter( bg=>bg.type==="free" ) ); } function showPaid(){ displayBackgrounds( backgrounds.filter( bg=>bg.type==="paid" ) ); } /* ========================= HOME ========================= */ function showHome(){ document.getElementById( "favoritesArea" ).style.display="none"; displayBackgrounds(); window.scrollTo({ top:0, behavior:"smooth" }); } /* ========================= FAVORITES ========================= */ function getFavorites(){ return JSON.parse( localStorage.getItem( "nyanFavorites" )||"[]" ); } function favorite(id){ let favorites= getFavorites(); if(!favorites.includes(id)){ favorites.push(id); alert( "❤️ Added to favorites!" ); }else{ favorites= favorites.filter( x=>x!==id ); alert( "Removed from favorites." ); } localStorage.setItem( "nyanFavorites", JSON.stringify( favorites ) ); } function showFavorites(){ document.getElementById( "favoritesArea" ).style.display="block"; const ids= getFavorites(); const list= backgrounds.filter( bg=>ids.includes(bg.id) ); const area= document.getElementById( "favorites" ); area.innerHTML=""; if(list.length===0){ area.innerHTML= '<div class="empty">'+ 'No favorites yet ❤️'+ '</div>'; return; } list.forEach(bg=>{ const card= document.createElement( "div" ); card.className="card"; card.innerHTML=` <img src="${bg.image}"> <div class="info"> <h3> ${escapeHTML(bg.name)} </h3> <div class="price"> ${bg.type==="free" ?"FREE" :"$"+Number(bg.price).toFixed(2)} </div> <button class="favorite" onclick="favorite(${bg.id});showFavorites()"> ❤️ Remove </button> </div> `; area.appendChild(card); }); } /* ========================= DETAILS ========================= */ function showDetails(id){ const bg= backgrounds.find( x=>x.id===id ); if(!bg)return; alert( "🎨 "+bg.name+ "\n💰 "+ (bg.type==="free" ?"FREE" :"$"+Number(bg.price).toFixed(2)) ); } /* ========================= DOWNLOAD ========================= */ function downloadBackground(id){ const bg= backgrounds.find( x=>x.id===id ); if(!bg)return; const link= document.createElement( "a" ); link.href=bg.image; link.download= bg.name .replace( /[^a-z0-9]/gi, "_" )+".jpg"; document.body.appendChild( link ); link.click(); link.remove(); } /* ========================= LOGIN ========================= */ function openLogin(){ document.getElementById( "loginPanel" ).classList.add("show"); document.getElementById( "loginPanel" ).scrollIntoView({ behavior:"smooth" }); } function closeLogin(){ document.getElementById( "loginPanel" ).classList.remove("show"); } function loginOwner(){ const code= document.getElementById( "ownerCode" ).value; if(code==="5124"){ document.getElementById( "ownerPanel" ).classList.add("show"); document.getElementById( "loginMessage" ).textContent= "✅ Owner login successful!"; closeLogin(); updateOwnerList(); document.getElementById( "ownerPanel" ).scrollIntoView({ behavior:"smooth" }); }else{ document.getElementById( "loginMessage" ).textContent= "❌ Wrong owner code."; } } function logoutOwner(){ document.getElementById( "ownerPanel" ).classList.remove( "show" ); document.getElementById( "ownerCode" ).value=""; } /* ========================= ADD ========================= */ function addBackground(){ const name= document.getElementById( "bgName" ).value.trim(); const type= document.getElementById( "bgType" ).value; const price= Number( document.getElementById( "bgPrice" ).value ); const file= document.getElementById( "bgImage" ).files[0]; if(!name||!file){ alert( "Enter a name and choose a picture." ); return; } /* FREE */ if(type==="free"){ if(price!==0){ alert( "FREE background price must be $0." ); return; } } /* PAID */ if(type==="paid"){ if(price<0.01){ alert( "Paid background needs a price." ); return; } if(price>0.30){ alert( "❌ Maximum price is $0.30." ); return; } } /* IMAGE SIZE */ if(file.size> 2*1024*1024){ alert( "❌ Image is bigger than 2 MB.\n\n"+ "Choose a smaller image." ); return; } const reader= new FileReader(); reader.onload=function(e){ const newBg={ id:Date.now(), name:name, type:type, price: type==="free" ?0 :price, image:e.target.result }; backgrounds.unshift( newBg ); saveData(); displayBackgrounds(); updateOwnerList(); document.getElementById( "bgName" ).value=""; document.getElementById( "bgPrice" ).value=""; document.getElementById( "bgImage" ).value=""; alert( "🎉 Background added!" ); }; reader.readAsDataURL(file); } /* ========================= OWNER LIST ========================= */ function updateOwnerList(){ const list= document.getElementById( "ownerList" ); list.innerHTML=""; backgrounds.forEach(bg=>{ const row= document.createElement( "div" ); row.className= "owner-item"; row.innerHTML=` <b> ${escapeHTML(bg.name)} </b> - ${bg.type==="free" ?"FREE" :"$"+Number(bg.price).toFixed(2)} <button class="delete" onclick="deleteBackground(${bg.id})"> 🗑️ Delete </button> `; list.appendChild(row); }); } /* ========================= DELETE ========================= */ function deleteBackground(id){ const bg= backgrounds.find( x=>x.id===id ); if(!bg)return; if(!confirm( 'Delete "'+ bg.name+ '"?' ))return; backgrounds= backgrounds.filter( x=>x.id!==id ); saveData(); displayBackgrounds(); updateOwnerList(); } /* ========================= DARK MODE ========================= */ function toggleDark(){ document.body.classList.toggle( "dark" ); localStorage.setItem( "nyanDark", document.body.classList.contains( "dark" ) ); } /* ========================= APP BUTTON ========================= */ function installApp(){ alert( "📱 Your shop is app-ready!\n\n"+ "To install it like an app, the website must first be placed online using HTTPS." ); } /* ========================= SAFETY ========================= */ function escapeHTML(text){ return String(text) .replaceAll("&","&amp;") .replaceAll("<","&lt;") .replaceAll(">","&gt;") .replaceAll('"',"&quot;") .replaceAll("'","&#039;"); } /* ========================= DARK START ========================= */ if( localStorage.getItem( "nyanDark" )==="true" ){ document.body.classList.add( "dark" ); } /* ========================= START ========================= */ displayBackgrounds(); </script> </body> </html>
